# Starts InfluxDB (time-series storage) and Grafana (dashboard)
services:
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin123
      DOCKER_INFLUXDB_INIT_ORG: pdm
      DOCKER_INFLUXDB_INIT_BUCKET: health
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: pdm-token-change-me
    volumes: [influx_data:/var/lib/influxdb2]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [influxdb]
    volumes: [grafana_data:/var/lib/grafana]
volumes:
  influx_data:
  grafana_data:
